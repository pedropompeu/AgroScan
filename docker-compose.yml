services:
  app:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: agroscan_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend-core:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=agroscan
      - DB_USERNAME=usuario
      - DB_PASSWORD=password123
      - AI_ENGINE_URL=http://backend-ai:8001
      - AI_CALLBACK_SECRET=agroscan-internal-secret
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=minio_user
      - AWS_SECRET_ACCESS_KEY=minio_pass123
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=agroscan
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    depends_on:
      - db
      - backend-ai
      - minio
    command: php artisan serve --host=0.0.0.0 --port=8000

  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: agroscan_ai
    ports:
      - "8001:8001"
    volumes:
      - ./backend-ai:/app
      - ai_model_cache:/root/.cache/huggingface
    environment:
      - AI_CALLBACK_SECRET=agroscan-internal-secret

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: agroscan_dashboard
    ports:
      - "4000:80"
    depends_on:
      - app
    environment:
      - VITE_API_URL=http://localhost:8000

  minio:
    image: minio/minio:latest
    container_name: agroscan_minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web (admin)
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_pass123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: agroscan_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio_user minio_pass123 &&
        mc mb --ignore-existing local/agroscan &&
        mc anonymous set download local/agroscan/scoutings
      "

  db:
    image: postgis/postgis:15-3.3
    container_name: agroscan_db
    environment:
      POSTGRES_DB: agroscan
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password123
    ports:
      - "5435:5432"
    volumes:
      - agroscan_data:/var/lib/postgresql/data

volumes:
  agroscan_data:
  ai_model_cache:
  minio_data:
